<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="408" viewBox="0 0 1000 408" role="img" aria-label="What I work on: detection and investigation, identity and Active Directory, security writing"><title>What I work on: detection and investigation, identity and Active Directory, security writing</title><style>@font-face{font-family:'IN';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JB';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'SG';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}</style><g class="r" style="animation-delay:0.00s"><g transform="translate(0,0)"><rect x="0.5" y="0.5" width="999" height="195" rx="16" fill="#14294D" stroke="#33507A"/><g transform="translate(24,24)"><circle cx="24" cy="24" r="21" fill="none" stroke="#5B9BE6" stroke-width="2"/><circle cx="24" cy="24" r="12.5" fill="none" stroke="#33507A" stroke-width="1.8"/><line x1="24" y1="24" x2="38" y2="10" stroke="#9CC3EE" stroke-width="2.6" stroke-linecap="round"/><circle cx="24" cy="24" r="3.2" fill="#9CC3EE"/><circle cx="33" cy="17" r="3" fill="#9CC3EE"/><circle cx="15" cy="33" r="2.6" fill="#5B9BE6"/></g><text x="90" y="46" font-family="'SG','Space Grotesk',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="23" fill="#EDF3FB" text-anchor="start">Detection &amp; Investigation</text><text x="90" y="70" font-family="'JB','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="400" font-size="12.5" fill="#93A9C2" text-anchor="start">WAZUH · SPLUNK · WINDOWS EVENT LOGS</text><text x="24" y="112" font-family="'IN','Inter',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15.5" fill="#93A9C2" text-anchor="start">My home SOC lab is where I train. I run an attack, triage the alert, dig through</text><text x="24" y="135" font-family="'IN','Inter',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15.5" fill="#93A9C2" text-anchor="start">the logs, and write up what happened and what I changed. Fifty-plus simulations</text><text x="24" y="158" font-family="'IN','Inter',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15.5" fill="#93A9C2" text-anchor="start">in, the write-ups are the portfolio.</text></g></g><g class="r" style="animation-delay:0.12s"><g transform="translate(0,212)"><rect x="0.5" y="0.5" width="491" height="195" rx="16" fill="#14294D" stroke="#33507A"/><g transform="translate(24,24)"><rect x="10" y="3" width="28" height="42" rx="6" fill="none" stroke="#5B9BE6" stroke-width="2"/><line x1="19" y1="8" x2="29" y2="8" stroke="#5B9BE6" stroke-width="2" stroke-linecap="round"/><circle cx="24" cy="21" r="5.5" fill="none" stroke="#9CC3EE" stroke-width="1.8"/><path d="M15.5 38 C17 31, 31 31, 32.5 38" fill="none" stroke="#9CC3EE" stroke-width="1.8" stroke-linecap="round"/></g><text x="90" y="46" font-family="'SG','Space Grotesk',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="23" fill="#EDF3FB" text-anchor="start">Identity &amp; Active Directory</text><text x="90" y="70" font-family="'JB','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="400" font-size="12.5" fill="#93A9C2" text-anchor="start">AD DS · GPO · ENTRA ID</text><text x="24" y="112" font-family="'IN','Inter',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15.5" fill="#93A9C2" text-anchor="start">A full Windows domain in the lab: users, groups, group</text><text x="24" y="135" font-family="'IN','Inter',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15.5" fill="#93A9C2" text-anchor="start">policy hardening, and the attacks that target them,</text><text x="24" y="158" font-family="'IN','Inter',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15.5" fill="#93A9C2" text-anchor="start">Kerberoasting included.</text></g></g><g class="r" style="animation-delay:0.24s"><g transform="translate(508,212)"><rect x="0.5" y="0.5" width="491" height="195" rx="16" fill="#14294D" stroke="#33507A"/><g transform="translate(24,24)"><path d="M14 3 L34 3 L38 8 L38 45 L14 45 Z" fill="none" stroke="#5B9BE6" stroke-width="2" stroke-linejoin="round"/><path d="M34 3 L34 8 L38 8" fill="none" stroke="#5B9BE6" stroke-width="1.8"/><line x1="19" y1="18" x2="33" y2="18" stroke="#9CC3EE" stroke-width="2.2" stroke-linecap="round"/><line x1="19" y1="26" x2="33" y2="26" stroke="#33507A" stroke-width="2.2" stroke-linecap="round"/><line x1="19" y1="34" x2="28" y2="34" stroke="#33507A" stroke-width="2.2" stroke-linecap="round"/></g><text x="90" y="46" font-family="'SG','Space Grotesk',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="23" fill="#EDF3FB" text-anchor="start">Security Writing</text><text x="90" y="70" font-family="'JB','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="400" font-size="12.5" fill="#93A9C2" text-anchor="start">BLUE TEAM BRIEF · LINKEDIN</text><text x="24" y="112" font-family="'IN','Inter',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15.5" fill="#93A9C2" text-anchor="start">A weekly newsletter that turns CISA and Canadian Cyber</text><text x="24" y="135" font-family="'IN','Inter',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15.5" fill="#93A9C2" text-anchor="start">Centre advisories into plain language a general reader</text><text x="24" y="158" font-family="'IN','Inter',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15.5" fill="#93A9C2" text-anchor="start">can act on.</text></g></g></svg>